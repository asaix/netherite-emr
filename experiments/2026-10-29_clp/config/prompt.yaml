template: |
  {mode} Write your entire response in {language}. End your response with a final line of the form "Answer: <answer>", where <answer> is {format}. Keep the word "Answer:" in English, use Western digits (0-9), and put nothing else on that line.

  {question}

modes:
  direct: Answer the following question directly. Do not provide any reasoning or explanation. Give only the final answer.
  cot: Solve the following question by reasoning through it step by step. Your reasoning must be written entirely in {language}; do not switch to another language at any point.
  en-cot: The following question is written in {source}. Solve it by reasoning through it step by step in {language}. Your reasoning must be written entirely in {language}; do not switch to another language at any point.

# Language the en-cot mode reasons in, whatever the question's language.
en_cot_language: en_US

clp:
  source: hi_IN
  target: en_US
  task: temporal reasoning
  # Qin et al. (2023): Please act as an expert in multi-lingual understanding in [Source Language Ls]. Request: [Given sentence X] Let's understand the task in [Target Language Lt] step-by-step!
  stage1: |-
    Please act as an expert in multi-lingual understanding in {source}. Write your entire response in {target}.
    Request: {question}
    Let's understand the task in {target} step-by-step!
  # Qin et al. (2023): After understanding, you should act as an expert in [Target Task T] in [Target Language Lt]. Let's resolve the task you understand above step-by-step! Finally, you should format your answer as 'Answer: [num]'.
  stage2: |-
    After understanding, you should act as an expert in {task} in {target}. Let's resolve the task you understand above step-by-step! Your reasoning must be written entirely in {target}; do not switch to another language at any point. End your response with a final line of the form "Answer: <answer>", where <answer> is {format}. Keep the word "Answer:" in English, use Western digits (0-9), and put nothing else on that line.

formats:
  date_addition: a date in YYYY-MM-DD format (e.g., 2025-03-07)
  date_subtraction: a date in YYYY-MM-DD format (e.g., 2025-03-07)
  date_recurrence: a date in YYYY-MM-DD format (e.g., 2025-03-07)
  time_addition: a 24-hour clock time in HH:MM format, without a date (e.g., 09:05)
  time_subtraction: a 24-hour clock time in HH:MM format, without a date (e.g., 09:05)
  date_duration: the number of days as a whole number, digits only, without units (e.g., 12)
  time_duration: the number of minutes as a whole number, digits only, without units (e.g., 95)
  interval_date: the start and end dates in YYYY-MM-DD format joined by the English word "to" (e.g., 2025-03-10 to 2025-03-16)
  day_of_week: the full name of the day of the week in {language}, spelled exactly like the examples in the question

languages:
  en_US: English
  es_ES: Spanish
  de_DE: German
  fr_FR: French
  it_IT: Italian
  pt_BR: Portuguese
  nl_NL: Dutch
  hi_IN: Hindi
  ar_SA: Arabic
  ja_JP: Japanese
