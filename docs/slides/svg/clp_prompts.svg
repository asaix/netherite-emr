<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" width="1120" height="450" font-family="'Liberation Sans', Arial, 'Noto Sans Devanagari', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#595959"/></marker></defs><rect x="0.0" y="0.0" width="1120.0" height="126.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="14.0" y="26.0" font-size="17" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Turn 1: understand</text><text x="14.0" y="52.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Please act as an expert in multi-lingual understanding in {source}. Write your entire response in {target}. Request: {question} Let&#x27;s</text><text x="14.0" y="72.8" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">understand the task in {target} step-by-step!</text><line x1="560.0" y1="130.0" x2="560.0" y2="158.0" stroke="#595959" stroke-width="2" marker-end="url(#a)"/><rect x="0.0" y="162.0" width="1120.0" height="150.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="14.0" y="188.0" font-size="17" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Turn 2: solve, same conversation</text><text x="14.0" y="214.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">After understanding, you should act as an expert in {task} in {target}. Let&#x27;s resolve the task you understand above step-by-step! Your</text><text x="14.0" y="234.8" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">reasoning must be written entirely in {target}; do not switch to another language at any point. End your response with a final line of the</text><text x="14.0" y="255.5" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">form &quot;Answer: &lt;answer&gt;&quot;, where &lt;answer&gt; is {format}.</text><text x="0.0" y="339.0" font-size="17" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal"></text><text x="240.0" y="339.0" font-size="17" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal"></text><line x1="0.0" y1="349.0" x2="248.0" y2="349.0" stroke="#595959" stroke-width="1.5"/><text x="0.0" y="369.4" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Source, target</text><text x="240.0" y="369.4" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">hi_IN, en_US</text><text x="0.0" y="399.4" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Task</text><text x="240.0" y="399.4" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">temporal reasoning</text><text x="0.0" y="429.4" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Changes from Qin et al.</text><text x="240.0" y="429.4" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">temperature fixed at 0; added write-in-English rule; no CLSP voting</text></svg>
