ution method</text><text x="0.0" y="139.6" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">RULE</text><text x="130.0" y="139.6" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">rule</text><text x="250.0" y="139.6" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Apply a stated task rule</text><text x="0.0" y="170.6" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">LEAP</text><text x="130.0" y="170.6" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">year</text><text x="250.0" y="170.6" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Decide whether year is leap</text><text x="0.0" y="201.6" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">MONTHLEN</text><text x="130.0" y="201.6" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">month</text><text x="250.0" y="201.6" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Look up days in month</text><text x="0.0" y="232.6" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">ANCHOR</text><text x="130.0" y="232.6" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">date, weekday</text><text x="250.0" y="232.6" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Recall a date&#x27;s weekday</text><text x="0.0" y="263.6" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">CONVERT</text><text x="130.0" y="263.6" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">value, unit</text><text x="250.0" y="263.6" font-size="15.5" font-weight="norma