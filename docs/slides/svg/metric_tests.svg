<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 384" width="1120" height="384" font-family="'Liberation Sans', Arial, 'Noto Sans Devanagari', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#595959"/></marker></defs><rect x="0.0" y="0.0" width="360.0" height="380.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="16.0" y="34.0" font-size="20" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Bootstrap intervals</text><text x="16.0" y="70.0" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Resample questions; each</text><text x="16.0" y="95.0" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">appears in three distractor</text><text x="16.0" y="120.0" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">conditions.</text><rect x="16.0" y="158.0" width="60.0" height="44.0" rx="4" fill="#E8F1F7" stroke="none" stroke-width="1.5"/><text x="46.0" y="186.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222" font-style="normal">Q3</text><rect x="86.0" y="158.0" width="60.0" height="44.0" rx="4" fill="#E8F1F7" stroke="none" stroke-width="1.5"/><text x="116.0" y="186.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222" font-style="normal">Q1</text><rect x="156.0" y="158.0" width="60.0" height="44.0" rx="4" fill="#E8F1F7" stroke="none" stroke-width="1.5"/><text x="186.0" y="186.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222" font-style="normal">Q3</text><text x="16.0" y="240.0" font-size="22" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">B = 2,000</text><text x="16.0" y="276.0" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">95% interval = 2.5th and</text><text x="16.0" y="301.0" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">97.5th percentiles</text><rect x="380.0" y="0.0" width="360.0" height="380.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="396.0" y="34.0" font-size="20" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Exact McNemar</text><text x="396.0" y="70.0" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Same question under two</text><text x="396.0" y="95.0" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">conditions. Only disagreeing</text><text x="396.0" y="120.0" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">pairs count.</text><rect x="396.0" y="158.0" width="150.0" height="44.0" rx="4" fill="#E8F1F7" stroke="none" stroke-width="1.5"/><text x="471.0" y="186.0" font-size="15.5" font-weight="normal" text-anchor="middle" fill="#222222" font-style="normal">b: only A right</text><rect x="556.0" y="158.0" width="150.0" height="44.0" rx="4" fill="#E8F1F7" stroke="none" stroke-width="1.5"/><text x="631.0" y="186.0" font-size="15.5" font-weight="normal" text-anchor="middle" fill="#222222" font-style="normal">c: only B right</text><text x="396.0" y="250.0" font-size="21" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">b ~ Binomial(b + c, 0.5)</text><rect x="760.0" y="0.0" width="360.0" height="380.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="776.0" y="34.0" font-size="20" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Holm correction</text><text x="776.0" y="70.0" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Nine tasks tested at once.</text><text x="776.0" y="95.0" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Sort p-values, smallest</text><text x="776.0" y="120.0" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">first.</text><text x="776.0" y="200.0" font-size="24" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">p(i) × (9 − i + 1)</text><text x="776.0" y="240.0" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Stop at the first p(i) above 0.05.</text></svg>
