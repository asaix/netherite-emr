<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 398" width="1120" height="398" font-family="'Liberation Sans', Arial, 'Noto Sans Devanagari', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#595959"/></marker></defs><rect x="0.0" y="0.0" width="550.0" height="190.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="14.0" y="28.0" font-size="17.5" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">English CoT, day of week: one day late</text><text x="14.0" y="56.0" font-size="15" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Question</text><text x="96.0" y="56.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Day of week of 2029-07-02, gold Monday</text><text x="14.0" y="82.0" font-size="15" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Trace</text><text x="96.0" y="82.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Total: 31 + 28 + 31 + 30 + 31 + 30 + 2 = 183 days.</text><text x="14.0" y="108.0" font-size="15" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Answer</text><text x="96.0" y="108.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Tuesday. 1 January to 2 July is 182 days.</text><rect x="570.0" y="0.0" width="550.0" height="190.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="584.0" y="28.0" font-size="17.5" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">English CoT, recurrence: skips 29 February</text><text x="584.0" y="56.0" font-size="15" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Question</text><text x="666.0" y="56.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2028-02-15, every 6 days, 4th occurrence</text><text x="584.0" y="82.0" font-size="15" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Trace</text><text x="666.0" y="82.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">From 2028-02-27 to 2028-03-05: 28 - 27 = 1 day in</text><text x="666.0" y="104.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">February, plus 5 days in March = 6 days ✓</text><text x="584.0" y="130.0" font-size="15" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Answer</text><text x="666.0" y="130.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2028-03-11, gold 2028-03-10</text><rect x="0.0" y="204.0" width="550.0" height="190.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="14.0" y="232.0" font-size="17.5" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">en-CoT, recurrence at k = 1: goes backwards</text><text x="14.0" y="260.0" font-size="15" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Question</text><text x="96.0" y="260.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">आज को छोड़कर, 1वीं आवृत्ति, ID 5</text><text x="14.0" y="286.0" font-size="15" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Trace</text><text x="96.0" y="286.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Given the phrasing &quot;excluding today,&quot; this suggests we</text><text x="96.0" y="308.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">need to find what comes before.</text><text x="14.0" y="334.0" font-size="15" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Answer</text><text x="96.0" y="334.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2025-04-06, gold 2025-04-14</text><rect x="570.0" y="204.0" width="550.0" height="190.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="584.0" y="232.0" font-size="17.5" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Hinglish, English question: date subtraction</text><text x="584.0" y="260.0" font-size="15" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Question</text><text x="666.0" y="260.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2025-05-01, 3 days ago</text><text x="584.0" y="286.0" font-size="15" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Trace</text><text x="666.0" y="286.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">01 minus 3 karne par hum 31 April par aayenge.</text><text x="584.0" y="312.0" font-size="15" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Answer</text><text x="666.0" y="312.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2025-04-30, gold 2025-04-28</text></svg>
