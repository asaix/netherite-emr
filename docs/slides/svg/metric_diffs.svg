<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 373.8" width="1120" height="373.8" font-family="'Liberation Sans', Arial, 'Noto Sans Devanagari', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#595959"/></marker></defs><text x="0.0" y="20.0" font-size="20" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Metric</text><text x="230.0" y="20.0" font-size="20" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Formula, percentage points</text><text x="730.0" y="20.0" font-size="20" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Example</text><line x1="0.0" y1="30.0" x2="738.0" y2="30.0" stroke="#595959" stroke-width="1.5"/><text x="0.0" y="61.3" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">CoT gain</text><text x="230.0" y="61.3" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">acc(CoT) − acc(direct)</text><text x="730.0" y="61.3" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">English: 88.5 − 59.0 = +29.5</text><text x="0.0" y="107.3" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Gap</text><text x="230.0" y="107.3" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">acc(English) − acc(Hindi)</text><text x="730.0" y="107.3" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">CoT: 88.5 − 59.4 = 29.1</text><text x="0.0" y="153.3" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Drop</text><text x="230.0" y="153.3" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">acc(no distractor) − acc(distractor)</text><text x="730.0" y="153.3" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Hindi CoT, time-related: 2.6</text><text x="0.0" y="199.3" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">CoT penalty</text><text x="230.0" y="199.3" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">drop(CoT) − drop(direct)</text><text x="730.0" y="199.3" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Hindi: 2.6 − 0.4 = 2.2</text><line x1="0.0" y1="227.8" x2="738.0" y2="227.8" stroke="#E3E3E3" stroke-width="1.5"/><text x="0.0" y="259.1" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Reasoning part</text><text x="230.0" y="259.1" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">acc(en-CoT) − acc(Hindi CoT)</text><text x="730.0" y="259.1" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">82.9 − 59.4 = 23.5</text><text x="0.0" y="305.1" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Question part</text><text x="230.0" y="305.1" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">acc(English CoT) − acc(en-CoT)</text><text x="730.0" y="305.1" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">88.9 − 82.9 = 6.0</text><text x="0.0" y="351.1" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Reasoning share</text><text x="230.0" y="351.1" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">reasoning part / gap</text><text x="730.0" y="351.1" font-size="20" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">23.5 / 29.5 = 79.7%</text></svg>
