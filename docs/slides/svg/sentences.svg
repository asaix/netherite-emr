e="normal">+23.7 [7.3, 41.1]</text><text x="0.0" y="89.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">The last time I had a weekly commitment was in January.</text><text x="545.0" y="89.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Date recurrence</text><text x="695.0" y="89.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Hindi</text><text x="790.0" y="89.3" font-size="15.5" font-weight="normal" text-anchor="end" fill="#222222" font-style="normal">134</text><text x="875.0" y="89.3" font-size="15.5" font-weight="normal" text-anchor="end" fill="#222222" font-style="normal">0</text><text x="895.0" y="89.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">+23.1 [15.7, 31.2]</text><text x="0.0" y="127.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Dates in February always confuse me a bit.</text><text x="545.0" y="127.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Date recurrence</text><text x="695.0" y="127.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">English</text><text x="790.0" y="127.3" font-size="15.5" font-weight="normal" text-anchor="end" fill="#222222" font-style="normal">155</text><text x="875.0" y="127.3" font-size="15.5" font-weight="normal" text-anchor="end" fill="#222222" font-style="normal">12</text><text x="895.0" y="127.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">+20.1 [11.3, 28.5]</text><text x="0.0" y="165.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Calendar dates can be so confusing sometimes.</text><text x="545.0" y="165.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal"