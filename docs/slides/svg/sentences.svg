ont-weight="normal" text-anchor="end" fill="#222222" font-style="normal">0</text><text x="895.0" y="241.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">+15.8 [5.6, 25.9]</text><text x="0.0" y="279.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">I never understood why we don&#x27;t use decimal time.</text><text x="545.0" y="279.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Time duration</text><text x="695.0" y="279.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Hindi</text><text x="790.0" y="279.3" font-size="15.5" font-weight="normal" text-anchor="end" fill="#222222" font-style="normal">121</text><text x="875.0" y="279.3" font-size="15.5" font-weight="normal" text-anchor="end" fill="#222222" font-style="normal">1</text><text x="895.0" y="279.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">+14.9 [2.3, 28.0]</text><text x="0.0" y="317.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Monday mornings are tough no matter what date it is.</text><text x="545.0" y="317.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Interval date</text><text x="695.0" y="317.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">English</text><text x="790.0" y="317.3" font-size="15.5" font-weight="normal" text-anchor="end" fill="#222222" font-style="normal">155</text><text x="875.0" y="317.3" font-size="15.5" font-weight="normal" text-anchor="end" fill="#222222" font-style="normal">2</text><text x="895.0" y="317.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">+13.5 [2.5, 24.6]</text><text x="0.0" y="355.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#2