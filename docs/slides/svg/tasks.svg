<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 467.20000000000005" width="1120" height="467.20000000000005" font-family="'Liberation Sans', Arial, 'Noto Sans Devanagari', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#595959"/></marker></defs><text x="0.0" y="16.0" font-size="16" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Task</text><text x="165.0" y="16.0" font-size="16" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Question (level: long)</text><text x="800.0" y="16.0" font-size="16" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Gold</text><text x="960.0" y="16.0" font-size="16" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Format</text><line x1="0.0" y1="26.0" x2="968.0" y2="26.0" stroke="#595959" stroke-width="1.5"/><text x="0.0" y="51.8" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Date addition</text><text x="165.0" y="51.8" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Today is 2030-03-12, what is the date going to be in 13 days?</text><text x="800.0" y="51.8" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2030-03-25</text><text x="960.0" y="51.8" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">YYYY-MM-DD</text><text x="0.0" y="89.8" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Date subtraction</text><text x="165.0" y="89.8" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Today is 2027-02-02, what was the date 9 days ago?</text><text x="800.0" y="89.8" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2027-01-24</text><text x="960.0" y="89.8" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">YYYY-MM-DD</text><text x="0.0" y="127.8" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Date duration</text><text x="165.0" y="127.8" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">How many day(s) (e.g., 5, 9) have passed between 2028-05-28 and 2028-06-12?</text><text x="800.0" y="127.8" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">15</text><text x="960.0" y="127.8" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">whole days</text><text x="0.0" y="165.8" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Date recurrence</text><text x="165.0" y="165.8" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Today is 2027-02-19, and I have a recurrence every 11 days.</text><text x="165.0" y="185.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Without counting today, what is the date of the 5 occurrence?</text><text x="800.0" y="165.8" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2027-04-15</text><text x="960.0" y="165.8" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">YYYY-MM-DD</text><text x="0.0" y="234.2" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Interval date</text><text x="165.0" y="234.2" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">If today is 2026-12-22, what are the dates for the start and end</text><text x="165.0" y="253.4" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">of next week, assuming Monday is the first day of the week?</text><text x="800.0" y="234.2" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2026-12-28 to</text><text x="800.0" y="253.4" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2027-01-03</text><text x="960.0" y="234.2" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">A to B</text><text x="0.0" y="302.6" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Day of week</text><text x="165.0" y="302.6" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">What day of the week (e.g., Monday, Tuesday, ...) is 2025-07-31?</text><text x="800.0" y="302.6" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Thursday</text><text x="960.0" y="302.6" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">weekday name</text><text x="0.0" y="340.6" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Time addition</text><text x="165.0" y="340.6" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">It is now 07:09, what will the time be in 4 hours and 17 minutes?</text><text x="800.0" y="340.6" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">11:26</text><text x="960.0" y="340.6" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">HH:MM</text><text x="0.0" y="378.6" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Time subtraction</text><text x="165.0" y="378.6" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">It is now 15:53, what was the time 0 hours and 53 minutes ago?</text><text x="800.0" y="378.6" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">15:00</text><text x="960.0" y="378.6" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">HH:MM</text><text x="0.0" y="416.6" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Time duration</text><text x="165.0" y="416.6" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">If I looked at the clock at 01:45 and now it is 05:17,</text><text x="165.0" y="435.8" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">how many minutes (e.g., 15, 23) have gone by?</text><text x="800.0" y="416.6" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">212</text><text x="960.0" y="416.6" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">whole minutes</text></svg>
