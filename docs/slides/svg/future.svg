<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 414" width="1120" height="414" font-family="'Liberation Sans', Arial, 'Noto Sans Devanagari', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#595959"/></marker></defs><text x="0.0" y="20.0" font-size="18" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Limit</text><text x="560.0" y="20.0" font-size="18" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Next run</text><rect x="0.0" y="36.0" width="480.0" height="44.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="16.0" y="65.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Non-standard Hindi carriers</text><line x1="486.0" y1="58.0" x2="552.0" y2="58.0" stroke="#595959" stroke-width="2" marker-end="url(#a)"/><rect x="560.0" y="36.0" width="560.0" height="44.0" rx="4" fill="#E8F1F7" stroke="none" stroke-width="1.5"/><text x="576.0" y="65.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Rerun recurrence with corrected templates</text><rect x="0.0" y="90.0" width="480.0" height="44.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="16.0" y="119.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">No English questions with Hindi reasoning</text><line x1="486.0" y1="112.0" x2="552.0" y2="112.0" stroke="#595959" stroke-width="2" marker-end="url(#a)"/><rect x="560.0" y="90.0" width="560.0" height="44.0" rx="4" fill="#E8F1F7" stroke="none" stroke-width="1.5"/><text x="576.0" y="119.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Add that arm</text><rect x="0.0" y="144.0" width="480.0" height="44.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="16.0" y="173.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">One prompt per condition</text><line x1="486.0" y1="166.0" x2="552.0" y2="166.0" stroke="#595959" stroke-width="2" marker-end="url(#a)"/><rect x="560.0" y="144.0" width="560.0" height="44.0" rx="4" fill="#E8F1F7" stroke="none" stroke-width="1.5"/><text x="576.0" y="173.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Several paraphrases of each prompt</text><rect x="0.0" y="198.0" width="480.0" height="44.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="16.0" y="227.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">CLP&#x27;s first turn often solves the problem</text><line x1="486.0" y1="220.0" x2="552.0" y2="220.0" stroke="#595959" stroke-width="2" marker-end="url(#a)"/><rect x="560.0" y="198.0" width="560.0" height="44.0" rx="4" fill="#E8F1F7" stroke="none" stroke-width="1.5"/><text x="576.0" y="227.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">CLP with solving forbidden in stage 1</text><rect x="0.0" y="252.0" width="480.0" height="44.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="16.0" y="281.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Thinking and token budget changed together</text><line x1="486.0" y1="274.0" x2="552.0" y2="274.0" stroke="#595959" stroke-width="2" marker-end="url(#a)"/><rect x="560.0" y="252.0" width="560.0" height="44.0" rx="4" fill="#E8F1F7" stroke="none" stroke-width="1.5"/><text x="576.0" y="281.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Thinking on and off at equal budgets</text><rect x="0.0" y="306.0" width="480.0" height="44.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="16.0" y="335.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Interventions cover wrong traces only</text><line x1="486.0" y1="328.0" x2="552.0" y2="328.0" stroke="#595959" stroke-width="2" marker-end="url(#a)"/><rect x="560.0" y="306.0" width="560.0" height="44.0" rx="4" fill="#E8F1F7" stroke="none" stroke-width="1.5"/><text x="576.0" y="335.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Question-by-mention factorial on correct and wrong traces</text><rect x="0.0" y="360.0" width="480.0" height="44.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="16.0" y="389.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Labels read by script and one LLM annotator</text><line x1="486.0" y1="382.0" x2="552.0" y2="382.0" stroke="#595959" stroke-width="2" marker-end="url(#a)"/><rect x="560.0" y="360.0" width="560.0" height="44.0" rx="4" fill="#E8F1F7" stroke="none" stroke-width="1.5"/><text x="576.0" y="389.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Human annotation of samples and error labels</text></svg>
