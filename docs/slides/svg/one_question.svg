<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="'Liberation Sans', Arial, 'Noto Sans Devanagari', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#595959"/></marker></defs><text x="0.0" y="20.0" font-size="16.5" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">English</text><text x="84.0" y="20.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Today is 2027-05-16, and I have a recurrence every 13 days. Without counting today, what is the date of the 7 occurrence?</text><text x="0.0" y="50.0" font-size="16.5" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Hindi</text><text x="84.0" y="50.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">आज 2027-05-16 है, और मेरे पास हर 13 दिनों पर एक पुनरावृत्ति है। आज को छोड़कर, 7वीं आवृत्ति की तिथि क्या है?</text><text x="0.0" y="80.0" font-size="16.5" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Distractor</text><text x="84.0" y="80.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">The last time I had a weekly commitment was in January. / आखिरी साप्ताहिक प्रतिबद्धता जनवरी में थी।</text><text x="0.0" y="110.0" font-size="16.5" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Gold</text><text x="84.0" y="110.0" font-size="16.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2027-08-15</text><text x="250.0" y="110.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#595959" font-style="normal">Long, date recurrence, ID 12. 2027-08-02 adds six intervals, not seven.</text><text x="0.0" y="141.0" font-size="17" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Condition</text><text x="280.0" y="141.0" font-size="17" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Reasons in</text><text x="520.0" y="141.0" font-size="17" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">No distractor</text><text x="760.0" y="141.0" font-size="17" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Time-related</text><line x1="0.0" y1="151.0" x2="768.0" y2="151.0" stroke="#595959" stroke-width="1.5"/><text x="0.0" y="172.1" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">English direct</text><text x="280.0" y="172.1" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal"></text><text x="520.0" y="172.1" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2027-06-05 ×</text><text x="760.0" y="172.1" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2027-04-19 ×</text><text x="0.0" y="203.1" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">English CoT</text><text x="280.0" y="203.1" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">English</text><text x="520.0" y="203.1" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2027-08-15 ✓</text><text x="760.0" y="203.1" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">cut off</text><text x="0.0" y="234.1" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Hindi direct</text><text x="280.0" y="234.1" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal"></text><text x="520.0" y="234.1" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2027-07-27 ×</text><text x="760.0" y="234.1" font-size="17" font-weight="normal