<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" width="1120" height="410" font-family="'Liberation Sans', Arial, 'Noto Sans Devanagari', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#595959"/></marker></defs><text x="0.0" y="56.0" font-size="44" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">79%</text><text x="110.0" y="44.0" font-size="18" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">English words in hidden Hindi CoT reasoning</text><text x="110.0" y="68.0" font-size="18" font-weight="normal" text-anchor="start" fill="#595959" font-style="normal">Visible answer stays in Hindi</text><text x="600.0" y="56.0" font-size="44" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">43.8%</text><text x="750.0" y="44.0" font-size="18" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">strict Hindi CoT cut at 4,096 tokens</text><text x="750.0" y="68.0" font-size="18" font-weight="normal" text-anchor="start" fill="#595959" font-style="normal">59.9% with thinking off</text><line x1="0.0" y1="92.0" x2="1120.0" y2="92.0" stroke="#E3E3E3" stroke-width="1.5"/><text x="0.0" y="121.5" font-size="17.5" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Format arguments</text><text x="680.0" y="121.5" font-size="17.5" font-weight="bold" text-anchor="end" fill="#595959" font-style="normal"></text><line x1="0.0" y1="131.5" x2="688.0" y2="131.5" stroke="#595959" stroke-width="1.5"/><text x="0.0" y="153.3" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Hindi direct hidden steps that are FORMAT</text><text x="680.0" y="153.3" font-size="17.5" font-weight="normal" text-anchor="end" fill="#222222" font-style="normal">207,097 of 627,487</text><text x="0.0" y="185.3" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Visible CoT steps that are FORMAT</text><text x="680.0" y="185.3" font-size="17.5" font-weight="normal" text-anchor="end" fill="#222222" font-style="normal">0.2%</text><text x="0.0" y="217.3" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">FORMAT share, date and time addition</text><text x="680.0" y="217.3" font-size="17.5" font-weight="normal" text-anchor="end" fill="#222222" font-style="normal">49.8%</text><text x="0.0" y="249.3" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">FORMAT share, interval date</text><text x="680.0" y="249.3" font-size="17.5" font-weight="normal" text-anchor="end" fill="#222222" font-style="normal">15.3%</text><text x="0.0" y="281.3" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Mean FORMAT steps, right vs wrong traces</text><text x="680.0" y="281.3" font-size="17.5" font-weight="normal" text-anchor="end" fill="#222222" font-style="normal">157 vs 120</text><rect x="720.0" y="110.0" width="400.0" height="158.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="734.0" y="136.0" font-size="14.5" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Adding one day: 5,170 words, 361 of 636 FORMAT</text><text x="734.0" y="166.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="italic">&quot;If I write: 2025-04-07. That&#x27;s not in Hindi. ...</text><text x="734.0" y="191.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="italic">But if I have no text outside the last line,</text><text x="734.0" y="216.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="italic">then there&#x27;s no Hindi text.&quot;</text><line x1="0.0" y1="298.0" x2="1120.0" y2="298.0" stroke="#E3E3E3" stroke-width="1.5"/><text x="0.0" y="332.0" font-size="18" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Errors</text><text x="170.0" y="332.0" font-size="18" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">287 of 422 wrong responses have no answer line, mostly at the 16,000-token limit</text><text x="0.0" y="366.0" font-size="18" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Disagreement</text><text x="170.0" y="366.0" font-size="18" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">31.7% → 10.9% on matched questions, unanswered counted wrong, OR 0.23 [0.18, 0.30]</text><text x="0.0" y="400.0" font-size="18" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Pairs</text><text x="170.0" y="400.0" font-size="18" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">1,159 both right, 20 English only, 11 Hindi only, 1 both wrong</text></svg>
