<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 408" width="1120" height="408" font-family="'Liberation Sans', Arial, 'Noto Sans Devanagari', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#595959"/></marker></defs><text x="0.0" y="22.0" font-size="20" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">20,662 English-Hindi trace pairs, 19,471 with thinking off</text><text x="1120.0" y="22.0" font-size="16" font-weight="normal" text-anchor="end" fill="#595959" font-style="normal">Hindi only 516, both wrong 1,711</text><rect x="0.0" y="40.0" width="673.8" height="44.0" rx="3" fill="#CFCFCF" stroke="none" stroke-width="1.5"/><text x="12.0" y="68.0" font-size="17" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Both right 12,468</text><rect x="675.8" y="40.0" width="321.4" height="44.0" rx="3" fill="#0072B2" stroke="none" stroke-width="1.5"/><text x="687.8" y="68.0" font-size="17" font-weight="bold" text-anchor="start" fill="#FFFFFF" font-style="normal">English only 5,967</text><rect x="999.3" y="40.0" width="26.0" height="44.0" rx="3" fill="#D55E00" stroke="none" stroke-width="1.5"/><rect x="1027.3" y="40.0" width="90.7" height="44.0" rx="3" fill="#8C8C8C" stroke="none" stroke-width="1.5"/><line x1="675.8" y1="92.0" x2="675.8" y2="104.0" stroke="#595959" stroke-width="1.5"/><line x1="675.8" y1="104.0" x2="1027.3" y2="104.0" stroke="#595959" stroke-width="1.5"/><line x1="1027.3" y1="92.0" x2="1027.3" y2="104.0" stroke="#595959" stroke-width="1.5"/><text x="1027.3" y="128.0" font-size="17" font-weight="normal" text-anchor="end" fill="#222222" font-style="normal">disagree = 1 when exactly one language is right</text><rect x="0.0" y="150.0" width="1120.0" height="66.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="560.0" y="191.1" font-size="23" font-weight="normal" text-anchor="middle" fill="#222222" font-style="normal">logit P(disagree) = β₀ + β₁ · RDS + task + difficulty + distractor + thinking mode</text><rect x="0.0" y="228.0" width="1120.0" height="66.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="560.0" y="268.4" font-size="21" font-weight="normal" text-anchor="middle" fill="#222222" font-style="normal">second model adds β₂ · |len en − len hi| / max(len en, len hi)</text><rect x="0.0" y="306.0" width="1120.0" height="66.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="560.0" y="347.1" font-size="23" font-weight="normal" text-anchor="middle" fill="#222222" font-style="normal">OR per 0.1 RDS = exp(0.1 · β₁) = exp(0.1 · 15.94) = 4.92</text><text x="0.0" y="400.0" font-size="16.5" font-weight="normal" text-anchor="start" fill="#595959" font-style="normal">Standard errors clustered by question. 21,600 pairs loaded, 938 dropped (answer unparsed), 6,739 questions.</text></svg>
