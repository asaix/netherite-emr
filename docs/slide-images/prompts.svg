<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 402" width="1120" height="402" font-family="'Liberation Sans', Arial, 'Noto Sans Devanagari', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#595959"/></marker></defs><rect x="0.0" y="0.0" width="1120.0" height="112.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="14.0" y="26.0" font-size="17" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Template, all conditions</text><text x="14.0" y="52.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">{mode} Write your entire response in {language}. End your response with a final line of the form &quot;Answer: &lt;answer&gt;&quot;, where &lt;answer&gt; is</text><text x="14.0" y="72.8" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">{format}. Keep the word &quot;Answer:&quot; in English, use Western digits (0-9), and put nothing else on that line.</text><rect x="0.0" y="124.0" width="550.0" height="112.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="14.0" y="150.0" font-size="17" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Direct</text><text x="14.0" y="176.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Answer the following question directly. Do not provide any</text><text x="14.0" y="196.8" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">reasoning or explanation. Give only the final answer.</text><rect x="570.0" y="124.0" width="550.0" height="112.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="584.0" y="150.0" font-size="17" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">CoT</text><text x="584.0" y="176.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Solve the following question by reasoning through it step by step.</text><text x="584.0" y="196.8" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Your reasoning must be written entirely in {language}; do not</text><text x="584.0" y="217.5" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">switch to another language at any point.</text><rect x="0.0" y="248.0" width="550.0" height="150.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="14.0" y="274.0" font-size="17" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">en-CoT</text><text x="14.0" y="300.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">The following question is written in {source}. Solve it by</text><text x="14.0" y="320.8" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">reasoning through it step by step in {language}. Your reasoning</text><text x="14.0" y="341.5" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">must be written entirely in {language}; do not switch to another</text><text x="14.0" y="362.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">language at any point.</text><rect x="570.0" y="248.0" width="550.0" height="150.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="584.0" y="274.0" font-size="17" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Hinglish</text><text x="584.0" y="300.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Solve the following question by reasoning through it step by step.</text><text x="584.0" y="320.8" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Your reasoning must be written in Hinglish, naturally mixing Hindi</text><text x="584.0" y="341.5" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">and English using only the Roman (Latin) script. Do not write in</text><text x="584.0" y="362.3" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Devanagari script (the final &quot;Answer:&quot; line is the only</text><text x="584.0" y="383.1" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">exception).</text></svg>
