<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 414" width="1120" height="414" font-family="'Liberation Sans', Arial, 'Noto Sans Devanagari', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#595959"/></marker></defs><rect x="0.0" y="0.0" width="550.0" height="190.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="14.0" y="28.0" font-size="17.5" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Hindi CoT, date subtraction: counts forward</text><text x="14.0" y="56.0" font-size="15" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Question</text><text x="96.0" y="56.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2027-05-09, 52 days ago</text><text x="14.0" y="82.0" font-size="15" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Trace</text><text x="96.0" y="82.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">From 9 May to 31 May is 22 days. ... April has 30 days,</text><text x="96.0" y="104.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">so the date exactly 30 days before 30 April is 1 May.</text><text x="14.0" y="130.0" font-size="15" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Answer</text><text x="96.0" y="130.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2027-05-01, gold 2027-03-18</text><rect x="570.0" y="0.0" width="550.0" height="190.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="584.0" y="28.0" font-size="17.5" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Hindi CoT, interval date: two-day week</text><text x="584.0" y="56.0" font-size="15" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Question</text><text x="666.0" y="56.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2030-05-15, next week</text><text x="584.0" y="82.0" font-size="15" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Trace</text><text x="666.0" y="82.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">15 May 2030 is a Saturday. ... The next Monday will be 18</text><text x="666.0" y="104.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">May 2030. ... Sunday will be 19 May 2030.</text><text x="584.0" y="130.0" font-size="15" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">Answer</text><text x="666.0" y="130.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">2030-05-18 to 05-19, gold 05-20 to 05-26</text><rect x="0.0" y="204.0" width="1120.0" height="206.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="14.0" y="232.0" font-size="17.5" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Hindi CoT, time addition: 10:46 plus 19 hours 41 minutes</text><text x="14.0" y="266.0" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">24 - 19 = 5 घंटे। तो, 19 घंटे और 41 मिनट का मतलब है कि हमें 5 घंटे और 41 मिनट जोड़ने हैं।</text><text x="14.0" y="296.0" font-size="15.5" font-weight="normal" text-anchor="start" fill="#595959" font-style="italic">24 - 19 = 5 ghaṇṭe. to, 19 ghaṇṭe aur 41 minaṭ kā matlab hai ki hameṃ 5 ghaṇṭe aur 41 minaṭ joṛne haiṃ.</text><text x="14.0" y="326.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">&#x27;24 - 19 = 5 hours. So 19 hours and 41 minutes means we have to add 5 hours and 41 minutes.&#x27;</text><text x="14.0" y="358.0" font-size="16.5" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Answer 16:27, gold 06:27.</text><text x="14.0" y="388.0" font-size="16.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Time addition error rate: 24 to 27% at every level.</text></svg>
