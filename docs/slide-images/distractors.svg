<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" width="1120" height="440" font-family="'Liberation Sans', Arial, 'Noto Sans Devanagari', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#595959"/></marker></defs><text x="0.0" y="22.0" font-size="19" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Time-related: 35 sentence pairs</text><text x="0.0" y="58.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">I always get confused with months that have 31 days.</text><text x="0.0" y="82.0" font-size="16" font-weight="normal" text-anchor="start" fill="#595959" font-style="normal">मुझे 31 दिनों वाले महीनों में भ्रम होता है।</text><text x="0.0" y="114.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">August is my favorite month of the year.</text><text x="0.0" y="138.0" font-size="16" font-weight="normal" text-anchor="start" fill="#595959" font-style="normal">अगस्त मेरा पसंदीदा महीना है।</text><text x="0.0" y="170.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">I always forget how many days are in each month.</text><text x="0.0" y="194.0" font-size="16" font-weight="normal" text-anchor="start" fill="#595959" font-style="normal">मैं भूल जाता हूं कि हर महीने में कितने दिन होते हैं।</text><text x="0.0" y="226.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">It&#x27;s interesting how we measure time in different cultures.</text><text x="0.0" y="250.0" font-size="16" font-weight="normal" text-anchor="start" fill="#595959" font-style="normal">यह दिलचस्प है कि हम समय कैसे मापते हैं।</text><text x="0.0" y="282.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">The summer of 2025 has been quite interesting.</text><text x="0.0" y="306.0" font-size="16" font-weight="normal" text-anchor="start" fill="#595959" font-style="normal">2025 की गर्मी दिलचस्प रही।</text><text x="0.0" y="338.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Time really flies when you&#x27;re having fun.</text><text x="0.0" y="362.0" font-size="16" font-weight="normal" text-anchor="start" fill="#595959" font-style="normal">मज़े करते समय वक्त उड़ जाता है।</text><text x="570.0" y="22.0" font-size="19" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Unrelated: 43 sentence pairs</text><text x="570.0" y="58.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">The garden needs new flowers.</text><text x="570.0" y="82.0" font-size="16" font-weight="normal" text-anchor="start" fill="#595959" font-style="normal">बगीचे में नए फूल चाहिए।</text><text x="570.0" y="114.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">My brother bought a motorcycle.</text><text x="570.0" y="138.0" font-size="16" font-weight="normal" text-anchor="start" fill="#595959" font-style="normal">मेरे भाई ने मोटरसाइकिल खरीदी।</text><text x="570.0" y="170.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">The recipe calls for sugar.</text><text x="570.0" y="194.0" font-size="16" font-weight="normal" text-anchor="start" fill="#595959" font-style="normal">रेसिपी में चीनी चाहिए।</text><text x="570.0" y="226.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Classical music helps me concentrate.</text><text x="570.0" y="250.0" font-size="16" font-weight="normal" text-anchor="start" fill="#595959" font-style="normal">शास्त्रीय संगीत मदद करता है।</text><text x="570.0" y="282.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">The museum opens at nine.</text><text x="570.0" y="306.0" font-size="16" font-weight="normal" text-anchor="start" fill="#595959" font-style="normal">संग्रहालय नौ बजे खुलता है।</text><text x="570.0" y="338.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">I need new running shoes.</text><text x="570.0" y="362.0" font-size="16" font-weight="normal" text-anchor="start" fill="#595959" font-style="normal">मुझे नए दौड़ने के जूते चाहिए।</text><line x1="0.0" y1="396.0" x2="1120.0" y2="396.0" stroke="#E3E3E3" stroke-width="1.5"/><text x="0.0" y="430.0" font-size="17.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Per task: 5 sentences of each kind, 45 task-sentence units per kind, 90 in all. Prepended to the question.</text></svg>
