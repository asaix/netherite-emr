<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="'Liberation Sans', Arial, 'Noto Sans Devanagari', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#595959"/></marker></defs><rect x="0.0" y="0.0" width="1120.0" height="62.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="560.0" y="39.0" font-size="23" font-weight="normal" text-anchor="middle" fill="#222222" font-style="normal">TLR = Devanagari words / (Devanagari words + Latin words)</text><text x="0.0" y="104.0" font-size="19" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Verification</text><text x="170.0" y="104.0" font-size="19" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">regex match on checking phrases</text><text x="0.0" y="140.0" font-size="19" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Mention</text><text x="170.0" y="140.0" font-size="19" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">regex match on distractor words; placebo is the same question without it</text><line x1="0.0" y1="164.0" x2="1120.0" y2="164.0" stroke="#E3E3E3" stroke-width="1.5"/><text x="0.0" y="198.0" font-size="19" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Mention odds ratio, per task and level stratum</text><text x="215.0" y="216.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#595959" font-style="normal">Correct</text><text x="345.0" y="216.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#595959" font-style="normal">Wrong</text><text x="138.0" y="266.0" font-size="16" font-weight="bold" text-anchor="end" fill="#595959" font-style="normal">Mentions</text><rect x="150.0" y="226.0" width="126.0" height="66.0" rx="4" fill="#E8F1F7" stroke="none" stroke-width="1.5"/><text x="213.0" y="268.0" font-size="24" font-weight="bold" text-anchor="middle" fill="#222222" font-style="normal">a</text><rect x="280.0" y="226.0" width="126.0" height="66.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="343.0" y="268.0" font-size="24" font-weight="bold" text-anchor="middle" fill="#222222" font-style="normal">b</text><text x="138.0" y="336.0" font-size="16" font-weight="bold" text-anchor="end" fill="#595959" font-style="normal">No mention</text><rect x="150.0" y="296.0" width="126.0" height="66.0" rx="4" fill="#E8F1F7" stroke="none" stroke-width="1.5"/><text x="213.0" y="338.0" font-size="24" font-weight="bold" text-anchor="middle" fill="#222222" font-style="normal">c</text><rect x="280.0" y="296.0" width="126.0" height="66.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="343.0" y="338.0" font-size="24" font-weight="bold" text-anchor="middle" fill="#222222" font-style="normal">d</text><rect x="490.0" y="232.0" width="630.0" height="118.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="805.0" y="299.1" font-size="23" font-weight="normal" text-anchor="middle" fill="#222222" font-style="normal">OR = Σ (a · d / n) / Σ (b · c / n)</text><text x="490.0" y="386.0" font-size="17" font-weight="normal" text-anchor="start" fill="#595959" font-style="normal">OR &lt; 1: traces with a mention are correct less often.</text></svg>
