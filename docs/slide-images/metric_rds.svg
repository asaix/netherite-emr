<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="'Liberation Sans', Arial, 'Noto Sans Devanagari', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#595959"/></marker></defs><text x="0.0" y="24.0" font-size="20" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">a, b: op-token lists of length n, m</text><rect x="0.0" y="44.0" width="1120.0" height="58.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="560.0" y="80.7" font-size="22" font-weight="normal" text-anchor="middle" fill="#222222" font-style="normal">D(i, 0) = i,   D(0, j) = j</text><rect x="0.0" y="110.0" width="1120.0" height="70.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="560.0" y="152.7" font-size="22" font-weight="normal" text-anchor="middle" fill="#222222" font-style="normal">D(i, j) = min { D(i−1, j) + 1,  D(i, j−1) + 1,  D(i−1, j−1) + cost(aᵢ, bⱼ) }</text><rect x="0.0" y="188.0" width="1120.0" height="70.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="560.0" y="232.1" font-size="26" font-weight="normal" text-anchor="middle" fill="#222222" font-style="normal">RDS = D(n, m) / max(n, m)</text><text x="0.0" y="290.0" font-size="18" font-weight="bold" text-anchor="start" fill="#595959" font-style="normal">cost(aᵢ, bⱼ)</text><text x="620.0" y="290.0" font-size="18" font-weight="bold" text-anchor="end" fill="#595959" font-style="normal"></text><line x1="0.0" y1="300.0" x2="628.0" y2="300.0" stroke="#595959" stroke-width="1.5"/><text x="0.0" y="320.4" font-size="18" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">same token</text><text x="620.0" y="320.4" font-size="18" font-weight="normal" text-anchor="end" fill="#222222" font-style="normal">0</text><text x="0.0" y="350.4" font-size="18" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">one token has a partial date, the other the full date</text><text x="620.0" y="350.4" font-size="18" font-weight="normal" text-anchor="end" fill="#222222" font-style="normal">0.5</text><text x="0.0" y="380.4" font-size="18" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">otherwise</text><text x="620.0" y="380.4" font-size="18" font-weight="normal" text-anchor="end" fill="#222222" font-style="normal">1</text><text x="720.0" y="318.0" font-size="18" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">RDS = 0: same steps, same order</text><text x="720.0" y="352.0" font-size="18" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">RDS = 1: no step in common</text></svg>
