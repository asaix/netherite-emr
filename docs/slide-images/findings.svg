<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" width="1120" height="450" font-family="'Liberation Sans', Arial, 'Noto Sans Devanagari', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#595959"/></marker></defs><text x="0.0" y="22.0" font-size="19" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">29.5-point gap on Hindi questions: share closed by each prompt</text><text x="170.0" y="54.0" font-size="15.5" font-weight="normal" text-anchor="middle" fill="#595959" font-style="normal">Hindi CoT 59.4%</text><text x="880.0" y="54.0" font-size="15.5" font-weight="normal" text-anchor="middle" fill="#595959" font-style="normal">English CoT 88.9%</text><rect x="170.0" y="62.0" width="710.0" height="16.0" rx="4" fill="#F0DCCF" stroke="none" stroke-width="1.5"/><text x="0.0" y="112.0" font-size="18" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Hinglish</text><line x1="170.0" y1="106.0" x2="170.0" y2="106.0" stroke="#E69F00" stroke-width="5"/><circle cx="170.0" cy="106.0" r="8" fill="#E69F00" stroke="#FFFFFF" stroke-width="2"/><text x="186.0" y="112.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">59.4%: none</text><text x="0.0" y="152.0" font-size="18" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">CLP</text><line x1="170.0" y1="146.0" x2="432.3" y2="146.0" stroke="#CC79A7" stroke-width="5"/><circle cx="432.3" cy="146.0" r="8" fill="#CC79A7" stroke="#FFFFFF" stroke-width="2"/><text x="448.3" y="152.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">70.3%: about a third</text><text x="0.0" y="192.0" font-size="18" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">en-CoT</text><line x1="170.0" y1="186.0" x2="735.6" y2="186.0" stroke="#009E73" stroke-width="5"/><circle cx="735.6" cy="186.0" r="8" fill="#009E73" stroke="#FFFFFF" stroke-width="2"/><text x="751.6" y="192.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">82.9%: about four-fifths</text><line x1="0.0" y1="208.0" x2="1120.0" y2="208.0" stroke="#E3E3E3" stroke-width="1.5"/><text x="0.0" y="244.0" font-size="19" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">CoT gain: +29.5 English, +4.7 Hindi; gap 4.3 → 29.1</text><text x="0.0" y="282.0" font-size="19" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Thinking on, 450 questions: gap 27.3 → 1.0, with four times the tokens</text><text x="0.0" y="320.0" font-size="19" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Hindi losses: methods seen mainly in Hindi traces; errors from reading Hindi remain under en-CoT</text><text x="0.0" y="358.0" font-size="19" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Distractors: penalty 2.2, largely one sentence</text><text x="0.0" y="396.0" font-size="19" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">RDS: OR 4.92 per 0.1, association only; 1.10 on step types without answers</text><text x="0.0" y="434.0" font-size="19" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Interventions: Q − P +5.3; written mention not isolated</text></svg>
