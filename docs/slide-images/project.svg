<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 386" width="1120" height="386" font-family="'Liberation Sans', Arial, 'Noto Sans Devanagari', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#595959"/></marker></defs><text x="0.0" y="24.0" font-size="20" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Questions, Sarvam-105B</text><rect x="0.0" y="46.0" width="330.0" height="108.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="14.0" y="74.0" font-size="16" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">English</text><text x="14.0" y="100.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">Today is 2025-08-26, what is</text><text x="14.0" y="124.0" font-size="16" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">the date going to be in 3 days?</text><rect x="0.0" y="166.0" width="330.0" height="108.0" rx="4" fill="#F4F4F2" stroke="none" stroke-width="1.5"/><text x="14.0" y="194.0" font-size="16" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Hindi</text><text x="14.0" y="222.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">आज 2025-08-26 है, 3 दिनों में</text><text x="14.0" y="246.0" font-size="17" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">तिथि क्या होगी?</text><text x="410.0" y="24.0" font-size="20" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Varied</text><rect x="410.0" y="46.0" width="370.0" height="70.0" rx="4" fill="#E8F1F7" stroke="none" stroke-width="1.5"/><text x="428.0" y="75.0" font-size="18" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Prompt</text><text x="428.0" y="100.0" font-size="16.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">direct or chain-of-thought (CoT)</text><rect x="410.0" y="124.0" width="370.0" height="70.0" rx="4" fill="#E8F1F7" stroke="none" stroke-width="1.5"/><text x="428.0" y="153.0" font-size="18" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Reasoning language</text><text x="428.0" y="178.0" font-size="16.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">English, Hindi or Hinglish</text><rect x="410.0" y="202.0" width="370.0" height="70.0" rx="4" fill="#E8F1F7" stroke="none" stroke-width="1.5"/><text x="428.0" y="231.0" font-size="18" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Distractor</text><text x="428.0" y="256.0" font-size="16.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">none, time-related or unrelated</text><line x1="334.0" y1="160.0" x2="406.0" y2="160.0" stroke="#595959" stroke-width="2" marker-end="url(#a)"/><line x1="784.0" y1="160.0" x2="856.0" y2="160.0" stroke="#595959" stroke-width="2" marker-end="url(#a)"/><text x="860.0" y="24.0" font-size="20" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Measured</text><rect x="860.0" y="46.0" width="260.0" height="70.0" rx="4" fill="#E7F4EF" stroke="none" stroke-width="1.5"/><text x="876.0" y="75.0" font-size="18" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Accuracy</text><text x="876.0" y="100.0" font-size="16.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">vs gold answers</text><rect x="860.0" y="124.0" width="260.0" height="70.0" rx="4" fill="#E7F4EF" stroke="none" stroke-width="1.5"/><text x="876.0" y="153.0" font-size="18" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Reasoning traces</text><text x="876.0" y="178.0" font-size="16.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">language, steps, checks</text><rect x="860.0" y="202.0" width="260.0" height="70.0" rx="4" fill="#E7F4EF" stroke="none" stroke-width="1.5"/><text x="876.0" y="231.0" font-size="18" font-weight="bold" text-anchor="start" fill="#222222" font-style="normal">Errors</text><text x="876.0" y="256.0" font-size="16.5" font-weight="normal" text-anchor="start" fill="#222222" font-style="normal">error types by condition</text><rect x="0.0" y="306.0" width="1120.0" height="76.0" rx="4" fill="#FBEEE6" stroke="none" stroke-width="1.5"/><text x="560.0" y="353.0" font-size="24" font-weight="bold" text-anchor="middle" fill="#222222" font-style="normal">Does CoT help temporal reasoning equally in English and Hindi?</text></svg>
