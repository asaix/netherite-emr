suppress_keyword_arithmetic_with: [GOAL, STEP, ANSWER, MONTHLEN]

answer_line: '^\s*(?:Answer|उत्तर(?:\s*है)?|जवाब)\s*\**\s*[:：]'

span: '(?:{DATE}|\d{1,2}:\d{2}|\d{4})\s*(?:to|through|until|से|-|–)\s*(?:{DATE}|\d{1,2}:\d{2}|\d{4})'

bracket_placeholder: '()'

