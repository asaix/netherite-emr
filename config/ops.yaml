GIVEN:
  args: [value]
  description: Read a value from question
GOAL:
  args: [target]
  description: Restate what must be found
PLAN:
  args: [method]
  description: Choose or announce solution method
RULE:
  args: [rule]
  description: Apply a stated task rule
LEAP:
  args: [year]
  description: Decide whether year is leap
MONTHLEN:
  args: [month]
  description: Look up days in month
ANCHOR:
  args: [date, weekday]
  description: Recall a known date's weekday
CONVERT:
  args: [value, unit]
  description: Change units or value representation
ADD:
  args: [x, y]
  description: Add two values together
SUB:
  args: [x, y]
  description: Subtract one value from another
MUL:
  args: [x, y]
  description: Multiply two values together
DIV:
  args: [x, y]
  description: Divide, including remainder or modulo
CMP:
  args: [x, y]
  description: Compare two values' sizes
ROLL:
  args: [unit]
  description: Carry across day/month/year boundary
STEP:
  args: [value, delta]
  description: Move one unit at once
CHECK:
  args: []
  description: Verify an earlier result again
REVISE:
  args: []
  description: Correct or abandon earlier step
IGNORE:
  args: [distractor]
  description: Mention or dismiss inserted distractor
FORMAT:
  args: []
  description: Deliberate over output format/language
ANSWER:
  args: [value]
  description: State the final answer
